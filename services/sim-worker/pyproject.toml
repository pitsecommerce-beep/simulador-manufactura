[project]
name = "sim-worker"
version = "0.1.0"
description = "Motor de simulación de eventos discretos (SimPy). Sin gráficos."
requires-python = ">=3.11"
dependencies = ["jobqueue", "simpy>=4.1"]

[project.scripts]
sim-worker = "sim_worker.main:main"

[tool.uv.sources]
jobqueue = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_worker"]
