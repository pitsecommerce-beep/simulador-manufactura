[project]
name = "sim-worker"
version = "0.1.0"
description = "Motor de línea (SimPy) como servicio HTTP interno. Sin gráficos."
requires-python = ">=3.11"
dependencies = ["simpy>=4.1", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.7"]

[project.scripts]
sim-worker = "sim_worker.main:main"


[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_worker"]
