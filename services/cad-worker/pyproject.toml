[project]
name = "cad-worker"
version = "0.1.0"
description = "Conversión STEP -> GLB por eslabón -> URDF. Las dependencias CAD se añaden en la fase 2."
requires-python = ">=3.11"
dependencies = ["jobqueue"]

[project.scripts]
cad-worker = "cad_worker.main:main"

[tool.uv.sources]
jobqueue = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_worker"]
