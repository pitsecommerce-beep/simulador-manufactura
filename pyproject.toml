# Espacio de trabajo uv para los servicios Python.
[tool.uv.workspace]
members = ["packages/jobqueue-py", "services/sim-worker", "services/cad-worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["jobqueue", "sim_worker", "cad_worker"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"packages/jobqueue-py/src/jobqueue/testing.py" = ["S608"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
