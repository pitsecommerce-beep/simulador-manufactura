[project]
name = "jobqueue"
version = "0.1.0"
description = "Cola de trabajos en Postgres compartida por los workers"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobqueue"]
